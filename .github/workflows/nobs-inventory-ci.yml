name: nobs-inventory CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: API, directory, Lansweeper and user tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  browser:
    name: Browser tests, group ${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c]   # the three groups in package.json (test:browser:a, :b, :c) run side by side
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:${{ matrix.group }}

  image:
    name: Docker image builds and answers health checks
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nobs-inventory:ci .
      - name: Start the image and check it answers
        run: |
          docker run -d --name ni -p 8080:8080 -e NI_ADMIN_PASSWORD=ci-password-123 nobs-inventory:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/health
          curl -fs http://localhost:8080/ > /dev/null
          docker logs ni | tail -5
