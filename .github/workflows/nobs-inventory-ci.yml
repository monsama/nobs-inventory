name: nobs-inventory CI

# Runs on pull requests and on pushes to main. A version tag is not tested again here: it points at a commit main
# already tested, and the release workflow runs the unit tests before it publishes.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request stops the run still going for the older one; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: API, directory, Lansweeper and user tests
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung test stops here, not after GitHub's six hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      # A dropped connection to the npm registry (ECONNRESET) is tried once more before the job fails.
      - run: npm ci || (sleep 15 && npm ci)
      # A high-severity advisory in what the server ships fails the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      # The Lansweeper push script runs on the customer's Lansweeper server; its helpers are tested here with PowerShell 7.
      - name: Push script tests
        run: pwsh -NoProfile -File tests/push-script.ps1

  browser:
    name: Browser tests, group ${{ matrix.group }}
    runs-on: ubuntu-latest
    # The Playwright image has Chromium and its system libraries already, so nothing is installed per run.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c]   # the three groups in package.json (test:browser:a, :b, :c) run side by side
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      # A dropped connection to the npm registry (ECONNRESET) is tried once more before the job fails.
      - run: npm ci || (sleep 15 && npm ci)
      - run: npm run test:browser:${{ matrix.group }}

  # The release steps run on every change, so a broken step or a bad action version fails here, not after a tag.
  release-check:
    name: "Release steps: archive, image build and scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: Every action version exists
        run: scripts/check-actions.sh
      - name: Archive (the same files the release archives)
        run: |
          git archive --format=tar.gz --prefix=nobs-inventory-check/ -o check.tar.gz HEAD \
            deploy-nobs.sh scripts Dockerfile docker-compose.yml proxy .env.example \
            package.json package-lock.json server public VERSION README.md
          tar -tzf check.tar.gz > /dev/null
      # The shared proxy's configuration, as deploy-nobs.sh writes it, checked by Caddy itself: with the inventory's site
      # and a second one (a wiki), both on one certificate, and with no site at all.
      - name: Proxy configuration is valid
        run: |
          set -e
          mkdir -p proxy/certificates
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=inventory.example.ch \
            -addext "subjectAltName=DNS:inventory.example.ch,DNS:wiki.example.ch" \
            -keyout proxy/certificates/nobs.key -out proxy/certificates/nobs.crt 2>/dev/null
          check() { docker run --rm -v "$PWD/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/proxy/sites:/etc/caddy/sites:ro" \
            -v "$PWD/proxy/certificates:/certs:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; }
          check
          printf 'NI_HOST=inventory.example.ch\n' > .env
          . scripts/proxy-lib.sh && proxy_site
          printf 'https://wiki.example.ch {\n\timport tls_and_headers\n\treverse_proxy dokuwiki:8080\n}\n' > proxy/sites/wiki.caddy
          check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nobs-inventory:check
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nobs-inventory:check
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
