name: nobs-inventory CI

# Runs on pull requests and on pushes to main. A version tag is not tested again here: it points at a commit main
# already tested, and the release workflow runs the unit tests before it publishes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: API, directory, Lansweeper and user tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # A high-severity advisory in what the server ships fails the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test

  browser:
    name: Browser tests, group ${{ matrix.group }}
    runs-on: ubuntu-latest
    # The Playwright image has Chromium and its system libraries already, so nothing is installed per run.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c]   # the three groups in package.json (test:browser:a, :b, :c) run side by side
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:browser:${{ matrix.group }}

  # The release steps run on every change, so a broken step or a bad action version fails here, not after a tag.
  release-check:
    name: "Release steps: archive, image build and scan"
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: Every action version exists
        run: scripts/check-actions.sh
      - name: Archive (the same files the release archives)
        run: |
          git archive --format=tar.gz --prefix=nobs-inventory-check/ -o check.tar.gz HEAD \
            deploy-nobs.sh scripts Dockerfile docker-compose.yml Caddyfile .env.example \
            package.json package-lock.json server public VERSION README.md
          tar -tzf check.tar.gz > /dev/null
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nobs-inventory:check
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nobs-inventory:check
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
