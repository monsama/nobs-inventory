name: release

# Runs on a version tag such as v0.2.0. Tests must pass first. Then it publishes:
#  - a downloadable archive with a checksum, attached to the GitHub release
#  - the Docker image ghcr.io/<owner>/nobs-inventory:<version>
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The unit tests gate the release. The browser tests run in CI on every push to main, so they are not repeated here.
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag must match the VERSION file
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$(cat VERSION)" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Archive (only what an install needs)
        run: |
          mkdir -p dist
          V="${{ steps.v.outputs.version }}"
          git archive --format=tar.gz --prefix="nobs-inventory-$V/" -o "dist/nobs-inventory-$V.tar.gz" HEAD \
            deploy-nobs.sh scripts Dockerfile docker-compose.yml Caddyfile .env.example \
            package.json package-lock.json server public VERSION README.md
          (cd dist && sha256sum "nobs-inventory-$V.tar.gz" > "nobs-inventory-$V.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is built and scanned before it is pushed: a high or critical problem in it stops the release.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nobs-inventory:scan
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nobs-inventory:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
