name: release

# Runs on a version tag such as v0.2.0, or by hand (Actions -> release -> Run workflow) on main, which tags the
# version in the VERSION file first. Tests must pass first. Then it publishes:
#  - a downloadable archive with a checksum, attached to the GitHub release
#  - the Docker image ghcr.io/<owner>/nobs-inventory:<version>
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read only by default; only the publishing job may write (tags, the release, the image).
permissions:
  contents: read

# Two releases never run at once; one started is never cancelled halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # By hand, only main is released: a release from another branch would publish code that is not on main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # A dropped connection to the npm registry (ECONNRESET) is tried once more before the job fails.
      - run: npm ci || (sleep 15 && npm ci)
      # The unit tests gate the release. The browser tests run in CI on every push to main, so they are not repeated here.
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag must match the VERSION file
        id: v
        run: |
          v="$(cat VERSION)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Run by hand: a version that is already tagged is refused, so a release is never published twice. Checked first;
      # the tag itself is set only once the image is scanned and pushed.
      - name: The version is not released yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          t="v${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$t" > /dev/null; then echo "$t is already released. Raise VERSION first."; exit 1; fi
      - name: Archive (only what an install needs)
        run: |
          mkdir -p dist
          V="${{ steps.v.outputs.version }}"
          git archive --format=tar.gz --prefix="nobs-inventory-$V/" -o "dist/nobs-inventory-$V.tar.gz" HEAD \
            deploy-nobs.sh scripts Dockerfile docker-compose.yml proxy .env.example \
            package.json package-lock.json server public VERSION README.md
          (cd dist && sha256sum "nobs-inventory-$V.tar.gz" > "nobs-inventory-$V.tar.gz.sha256")
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is built and scanned before anything is published: a high or critical problem in it stops the release.
      # The image pushed is the one scanned, and the release with its archive comes last, so there is never a release
      # without its image.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            nobs-inventory:scan
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nobs-inventory:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push the scanned image
        run: docker push "ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}"
      - name: Tag the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          t="v${{ steps.v.outputs.version }}"
          git tag "$t" "$GITHUB_SHA" && git push origin "$t"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: dist/*
          generate_release_notes: true
