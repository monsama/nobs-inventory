# NOBS Inventory. Generated values live in ./secrets and .env (see deploy-nobs.sh).
# HTTPS comes from the shared proxy in proxy/ (its own Compose project, started by deploy-nobs.sh and update.sh).
name: nobs-inventory

services:
  app:
    container_name: nobs-inventory
    # Pinned release image (set NI_IMAGE in .env). Built locally only if the pull is not possible.
    image: ${NI_IMAGE:-ghcr.io/monsama/nobs-inventory:0.9.62}
    build: .
    restart: unless-stopped
    # No extra rights inside the container: it needs none to serve the inventory.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose:
      - "8080"
    environment:
      NI_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      NI_LDAP_SERVICE_PASSWORD_FILE: /run/secrets/ldap_service_password
      NI_LS_TOKEN_FILE: /run/secrets/ls_token
      NI_FEED_TOKEN_FILE: /run/secrets/feed_token
      NI_SHEET_KEY_FILE: /run/secrets/sheet_key
      # Caddy serves HTTPS, so the session cookie is sent only over HTTPS.
      NI_SECURE_COOKIE: ${NI_SECURE_COOKIE:-1}
      # The time zone of scheduled syncs ("daily at 06:00"), the entry-sheet clean-up and the server's history stamps.
      TZ: ${TZ:-Europe/Zurich}
      NI_LDAP_URL: ${NI_LDAP_URL:-}
      NI_LDAP_BIND: ${NI_LDAP_BIND:-}
      NI_LDAP_BASE: ${NI_LDAP_BASE:-}
      NI_LDAP_GROUP: ${NI_LDAP_GROUP:-}
      NI_LDAP_ADMIN_GROUP: ${NI_LDAP_ADMIN_GROUP:-}
      NI_LDAP_SERVICE_DN: ${NI_LDAP_SERVICE_DN:-}
      NI_LDAP_USER_FILTER: ${NI_LDAP_USER_FILTER:-}
      NI_LDAP_CA: ${NI_LDAP_CA:-}
      # Directory ports allowed beside 389/636/3268/3269 for an address saved in Settings (comma separated).
      NI_LDAP_PORTS: ${NI_LDAP_PORTS:-}
      # The proxy whose forwarded client address is believed: the shared Caddy container.
      NI_TRUSTED_PROXY: ${NI_TRUSTED_PROXY:-nobs-proxy}
      NI_LS_URL: ${NI_LS_URL:-}
      NI_LS_AUTH_SCHEME: ${NI_LS_AUTH_SCHEME:-}
      NI_LS_SITE: ${NI_LS_SITE:-}
      NI_FEED_CSV: ${NI_FEED_CSV:-}
    secrets:
      - admin_password
      - ldap_service_password
      - ls_token
      - feed_token
      - sheet_key
    volumes:
      - ni-data:/data
      - ./feed:/feed:ro
    # The shared proxy (proxy/, its own Compose project) reaches the app as nobs-inventory:8080 on this network.
    networks:
      - default
      - nobs-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


secrets:
  admin_password:
    file: ./secrets/admin_password
  ldap_service_password:
    file: ./secrets/ldap_service_password
  ls_token:
    file: ./secrets/ls_token
  feed_token:
    file: ./secrets/feed_token
  sheet_key:
    file: ./secrets/sheet_key

volumes:
  ni-data:
    name: nobs-inventory-data

networks:
  nobs-proxy:
    external: true
