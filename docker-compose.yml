# NOBS Inventory. Generated values live in ./secrets and .env (see deploy-nobs.sh).
name: nobs-inventory

services:
  app:
    container_name: nobs-inventory
    # Pinned release image (set NI_IMAGE in .env). Built locally only if the pull is not possible.
    image: ${NI_IMAGE:-ghcr.io/monsama/nobs-inventory:0.7.1}
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      NI_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      NI_LDAP_SERVICE_PASSWORD_FILE: /run/secrets/ldap_service_password
      NI_LS_TOKEN_FILE: /run/secrets/ls_token
      NI_FEED_TOKEN_FILE: /run/secrets/feed_token
      # Caddy serves HTTPS, so the session cookie is sent only over HTTPS.
      NI_SECURE_COOKIE: ${NI_SECURE_COOKIE:-1}
      NI_LDAP_URL: ${NI_LDAP_URL:-}
      NI_LDAP_BIND: ${NI_LDAP_BIND:-}
      NI_LDAP_BASE: ${NI_LDAP_BASE:-}
      NI_LDAP_GROUP: ${NI_LDAP_GROUP:-}
      NI_LDAP_ADMIN_GROUP: ${NI_LDAP_ADMIN_GROUP:-}
      NI_LDAP_SERVICE_DN: ${NI_LDAP_SERVICE_DN:-}
      NI_LDAP_USER_FILTER: ${NI_LDAP_USER_FILTER:-}
      NI_LDAP_CA: ${NI_LDAP_CA:-}
      NI_LS_URL: ${NI_LS_URL:-}
      NI_LS_AUTH_SCHEME: ${NI_LS_AUTH_SCHEME:-}
      NI_LS_SITE: ${NI_LS_SITE:-}
      NI_FEED_CSV: ${NI_FEED_CSV:-}
    secrets:
      - admin_password
      - ldap_service_password
      - ls_token
      - feed_token
    volumes:
      - ni-data:/data
      - ./feed:/feed:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    container_name: nobs-inventory-proxy
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NI_HOST: ${NI_HOST:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certificates:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

secrets:
  admin_password:
    file: ./secrets/admin_password
  ldap_service_password:
    file: ./secrets/ldap_service_password
  ls_token:
    file: ./secrets/ls_token
  feed_token:
    file: ./secrets/feed_token

volumes:
  ni-data:
    name: nobs-inventory-data
  caddy-data:
    name: nobs-inventory-caddy-data
  caddy-config:
    name: nobs-inventory-caddy-config
