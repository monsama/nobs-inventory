<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOBS Inventory</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="bar">
  <button id="sideBtn" class="icon" title="Filters" aria-label="Show filters"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div id="brand"><img class="logo" src="logo.svg" alt=""><span><b>NOBS</b> <span class="word">Inventory</span></span></div>
  <div class="gs" id="gsBox"><input id="search" type="search" placeholder="Search everything…  Ctrl+K" aria-label="Search everything: devices, people, contacts, contracts, rooms" autocomplete="off"><ul id="gsList" class="gs-list" role="listbox" aria-label="Search results" hidden></ul></div>
  <button id="newBtn" class="primary" aria-label="New object"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="hide-n">New object</span></button>
  <button id="linkBtn" title="Connect an object that already exists" aria-label="Link object"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="hide-n">Link object</span></button>
  <div class="grow"></div>
  <button id="barMoreBtn" class="icon" aria-label="Account, sign out and display" aria-expanded="false" aria-controls="barMore" title="Account, sign out and display"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  <div id="barMore">
  <button id="whoBtn" class="ghost" title="Your account: name, department and password">Signed out</button><button id="signOutBtn" class="ghost" title="Sign out of this browser" hidden>Sign out</button>
  <button id="themeBtn" class="icon" title="Switch light / dark" aria-label="Switch light or dark"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <a id="coffeeBtn" class="btnlike icon" href="https://buymeacoffee.com/monsama" target="_blank" rel="noopener noreferrer" title="Buy me a coffee: if NOBS Inventory saves you some time" aria-label="Buy me a coffee"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/></svg></a>
  </div>
  <button id="setBtn" class="icon" title="Settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>

<div id="main">
  <aside id="side" aria-label="Filters">
    <div class="hdr" id="scopeHdr" hidden>To review</div>
    <div class="sidegroup" id="scopeList" hidden></div>
    <div class="hdr">Types <button id="clearF">Clear filters</button></div>
    <div class="sidegroup" id="typeList"></div>
    <div class="hdr">Locations</div>
    <div class="sidegroup" id="locList"></div>
    <div class="hdr">Status</div>
    <div class="sidegroup" id="statList"></div>
    <div class="hdr">Warranty</div>
    <div class="sidegroup" id="wtyList"></div>
    <div class="hdr" id="chkHdr">Lansweeper</div>
    <div class="sidegroup" id="chkList"></div>
    <div class="hdr" id="dupHdr" hidden>Duplicates</div>
    <div class="sidegroup" id="dupList" hidden></div>
    <div class="hdr" id="grHdr" hidden>Entra &amp; Intune</div>
    <div class="sidegroup" id="grList" hidden></div>
    <div class="hdr" id="osHdr" hidden>Operating system</div>
    <div class="sidegroup" id="osList" hidden></div>
    <div class="hdr" id="respHdr" hidden>Responsible</div>
    <div class="sidegroup" id="respList" hidden></div>
    <div class="hdr" id="adgHdr" hidden>AD group</div>
    <div class="sidegroup" id="adgList" hidden></div>
  </aside>

  <section id="content">
    <nav id="tabsbar" aria-label="Views"></nav>
    <nav id="objbar" aria-label="Open objects" hidden></nav>
    <div id="toolbar" class="toolbar"></div>
    <div id="fbar" class="fbar" hidden aria-label="Active filters"></div>
    <div id="view" class="view"></div>
  </section>
</div>

<footer class="statusbar">
  <span id="stObjs"></span>
  <span id="stRels"></span>
  <span class="hide-n" id="stSave" role="status"></span>
  <span class="hide-n" id="stSync"></span>
  <span class="hide-n muted" id="verFoot"></span>
  <button type="button" class="hide-n sb-keys" id="keysBtn" title="Keyboard shortcuts">? Shortcuts</button>
</footer>

<div id="modalHost"></div>
<div id="toast" class="off" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
