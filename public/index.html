<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOBS Inventory</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the NOBS editor frame - top bar, sidebar of filters, tab bar, toolbar, work area, status bar.
   Colours are the NOBS SQL Editor's own tokens, so both tools read as one family. */
:root{--danger:#e5534b;--danger-bg:#b23b3b;--warn:#d9822b;--warnbtn:#b45309;--ok:#2e7d46;--okdot:#3fb950;--r-s:3px;--r-m:5px;--r-l:6px;
 --mono:'Cascadia Code',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;
 --bg:#fff;--fg:#1c1c1c;--panel:#eef0f3;--panel2:#e6e6e6;--bd:#ccc;--bd2:#e2e2e2;--hover:#eaf2fb;--accent:#1565c0;--accentbtn:#1565c0;--accentfg:#fff;--muted:#5c5c5c;
 --gridh:#f6f6f7;--sub:#eef3fa;--warntext:#a3520a;--linktext:#1565c0;--even:#fafafa;--btn:#fafafa;--in:#fff;--log:#1e1e1e;--logfg:#d4d4d4;
 --sb:rgba(0,0,0,.28);--port:#dfe3e8;--portbd:#b8bec6;--used:#2e7d46;--upl:#1565c0;--poe:#d9822b;--line:#2a5a9e;--hi:#f5c518;
 --t-pc:#1565c0;--t-server:#6a3fb5;--t-sip:#1a7a5e;--t-tablet:#b5651d;--t-monitor:#4f5b66;--t-switch:#a8442a;--t-printer:#7a6a00;--t-patch:#8a5a00;
 --shadow:0 4px 16px rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#1e1e1e;--fg:#e0e0e0;--panel:#2a2d31;--panel2:#333;--bd:#444;--bd2:#3a3a3a;--hover:#33404d;--accent:#3b82f6;--accentbtn:#1d4ed8;--accentfg:#fff;--muted:#b4b4b4;
 --gridh:#282828;--sub:#232a33;--warntext:#e0a35a;--linktext:#6ea8fe;--even:#262626;--btn:#333;--in:#2a2a2a;--log:#141414;--logfg:#d4d4d4;
 --sb:rgba(255,255,255,.24);--port:#3a3e44;--portbd:#555b63;--used:#2e7d46;--upl:#3b82f6;--poe:#e0a828;--line:#8fb8e8;--hi:#f5c518;
 --t-pc:#6ea8fe;--t-server:#b49cf0;--t-sip:#5dcaa5;--t-tablet:#f0a868;--t-monitor:#a9b4bf;--t-switch:#f0997b;--t-printer:#d8c44a;--t-patch:#d9a441;
 --shadow:0 4px 16px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#1e1e1e;--fg:#e0e0e0;--panel:#2a2d31;--panel2:#333;--bd:#444;--bd2:#3a3a3a;--hover:#33404d;--accent:#3b82f6;--accentbtn:#1d4ed8;--accentfg:#fff;--muted:#b4b4b4;
 --gridh:#282828;--sub:#232a33;--warntext:#e0a35a;--linktext:#6ea8fe;--even:#262626;--btn:#333;--in:#2a2a2a;--log:#141414;--logfg:#d4d4d4;
 --sb:rgba(255,255,255,.24);--port:#3a3e44;--portbd:#555b63;--used:#2e7d46;--upl:#3b82f6;--poe:#e0a828;--line:#8fb8e8;--hi:#f5c518;
 --t-pc:#6ea8fe;--t-server:#b49cf0;--t-sip:#5dcaa5;--t-tablet:#f0a868;--t-monitor:#a9b4bf;--t-switch:#f0997b;--t-printer:#d8c44a;--t-patch:#d9a441;
 --shadow:0 4px 16px rgba(0,0,0,.45);color-scheme:dark}

*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
html,body{height:100%;margin:0;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;color:var(--fg);background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
input[type=file]{max-width:100%;min-width:0;font-size:12px}
input,select,textarea{background:var(--in);color:var(--fg);border:1px solid var(--bd);border-radius:var(--r-s);padding:3px 6px;height:28px}
/* A select draws its text a few pixels in from an input's, so its left padding is less, and the text lines up. */
select{padding-left:2px}
/* Fields inside a label would take the label's small text; they keep the size of every other field. */
label>input,label>select,label>textarea{font-size:13px}
code{font-family:var(--mono)}
/* A text field with the app's own pick list, drawn like the other dropdowns. */
.combo{position:relative;min-width:0}
.combo>input{width:100%;padding-right:26px}
.combo-arrow{position:absolute;right:1px;top:1px;bottom:1px;width:24px;height:auto;padding:0;border:0;background:none;color:var(--muted)}
.combo-arrow:hover{color:var(--fg)}
.combo>input:disabled+.combo-arrow{opacity:.4;pointer-events:none}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:60;margin:0;padding:4px 0;list-style:none;max-height:260px;overflow:auto;background:var(--in);border:1px solid var(--bd);border-radius:var(--r-s);box-shadow:var(--shadow)}
.combo-list li{padding:5px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-list li:hover,.combo-list li.active{background:var(--hover)}
.combo-list li[aria-selected="true"]{font-weight:600}
textarea{height:auto;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
button{padding:0 9px;height:28px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--btn);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover:not(:disabled){filter:brightness(1.08)} button:active:not(:disabled){filter:brightness(.93)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.locgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
/* A count in a title bar, the same everywhere: muted, normal case. */
.hdr .cnt{font-weight:500;margin-left:6px;color:var(--muted);text-transform:none;letter-spacing:0}
.locpanel{min-width:0}
table.locs{width:100%;table-layout:fixed}
table.locs th,table.locs td{padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.locs td input{width:100%;height:28px;min-width:0;box-sizing:border-box}
table.locs td.n,table.locs th.n{text-align:right;color:var(--muted)}
table.locs td.act{width:1%}
table.locs td.site{color:var(--muted)}
.locpanel>.note{margin:0;padding:0 12px 12px}
@media (max-width:760px){.locgrid{grid-template-columns:minmax(0,1fr)}}
.ctlrow{display:flex;align-items:center;gap:10px;min-width:0}
.ctlrow>:not(.pchk):not(.pchk-slot){flex:1;min-width:0}
.ctlrow .pchk{white-space:nowrap;flex:none}
.plans{display:flex;flex-direction:column;min-height:0}
.pl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--bd2)}
.pl-bar select{height:30px;min-width:200px}
.pl-bar button.on{background:var(--accent);color:var(--accentfg);border-color:var(--accent)}
.pl-sep{width:1px;height:22px;background:var(--bd2);margin:0 4px}
.pl-zoom{display:inline-flex;gap:0}
.pl-zoom button{border-radius:0;min-width:30px}
.pl-zoom button:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}
.pl-zoom button:last-child{border-radius:0 var(--r-s) var(--r-s) 0}
.pl-zv{min-width:58px;font-variant-numeric:tabular-nums}
.pl-body{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 190px);min-height:360px}
.pl-side{border-right:1px solid var(--bd2);display:flex;flex-direction:column;min-height:0}
.pl-shead{padding:10px 12px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--bd2)}
.pl-q{padding:8px 10px}
.pl-q>input{width:100%;height:28px;box-sizing:border-box}
.pl-filters{display:flex;gap:6px;margin-top:6px}
.pl-filters select{flex:1 1 0;min-width:0;height:28px}
.pl-list{overflow:auto;flex:1;min-height:0}
.pl-item{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 12px;border:0;border-radius:0;background:transparent;box-shadow:none;justify-content:flex-start}
.pl-item:hover{background:var(--hover)}
.pl-item.on{background:var(--panel2);font-weight:600}
.pl-ghost{position:fixed;z-index:200;pointer-events:none;padding:4px 10px;border-radius:12px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
body.pl-dragging,body.pl-dragging *{cursor:copy!important;user-select:none}
.pl-area.droptarget .pl-area-fill{fill:rgba(37,99,235,.28)}
.pl-area.droptarget .pl-area-edge{stroke-width:3}
.pl-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pl-none{padding:12px}
.pl-tip{margin:0;padding:10px 12px;border-top:1px solid var(--bd2)}
.pl-stage{overflow:auto;background:var(--panel2);padding:18px;min-width:0}
.pl-canvas{position:relative;width:100%;margin:0 auto;user-select:none;touch-action:none}
.pl-canvas.noimg{min-height:360px;background:var(--panel);border:1px dashed var(--bd);border-radius:var(--r-m)}
.pl-noimg{position:absolute;left:0;right:0;bottom:0;padding:16px 24px;text-align:center;color:var(--muted);font-size:13px;pointer-events:none}
.pl-canvas>img{display:block;width:100%;height:auto;border-radius:var(--r-s);box-shadow:0 2px 14px rgba(0,0,0,.28);pointer-events:none}
.pl-area{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pl-area-fill{fill:rgba(37,99,235,.10)}
.pl-area-edge{fill:none;stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pl-area-tag{position:absolute;display:flex;align-items:center;gap:6px;margin:4px 0 0 4px;padding:2px 4px 2px 8px;border-radius:4px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;pointer-events:none;white-space:nowrap}
.pl-area-tag .pl-x{pointer-events:auto;position:static;width:18px;height:18px;border-radius:50%}
/* An area's svg covers the whole canvas; only the shape itself takes a click, so the rest of the plan stays free. */
.pl-area.movable{pointer-events:none}
.pl-area.movable .pl-area-fill,.pl-area.movable .pl-area-edge{pointer-events:visiblePainted;cursor:move}
.pl-area.editing .pl-area-edge{stroke-width:3px}
.pl-x{pointer-events:auto;position:absolute;right:4px;top:4px;width:20px;height:20px;padding:0;line-height:1;font-size:14px;background:rgba(0,0,0,.55);color:#fff;border:0}
.pl-pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 6px;border-radius:12px;border:2px solid #fff;color:#fff;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab;white-space:nowrap;max-width:220px;z-index:2}
.pl-code{font-family:var(--mono,monospace)}
.pl-card{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--bg);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:12px;font-weight:400;text-align:left;white-space:nowrap;pointer-events:none;z-index:2}
.pl-pin:hover .pl-card,.pl-pin:focus-visible .pl-card{display:flex}
.pl-pin.auto{opacity:.8;border-style:dashed}
.pl-unpin{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:2px;border-radius:50%;background:rgba(0,0,0,.4);font-size:13px;line-height:1;cursor:pointer}
.pl-unpin:hover{background:rgba(0,0,0,.65)}
.pl-pin:active{cursor:grabbing}
.pl-preview{position:absolute;border:2px solid var(--accent);background:rgba(37,99,235,.18);pointer-events:none;z-index:1}
.pl-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:320px;color:var(--muted);text-align:center;padding:24px}
@media (max-width:760px){.pl-body{grid-template-columns:1fr;height:auto}.pl-side{max-height:200px}.pl-stage{min-height:260px;padding:10px}.pl-bar{padding:8px 10px;gap:6px}.pl-bar select{min-width:0;flex:1 1 100%}.pl-bar .grow{display:none}.pl-zoom{margin-left:auto}.pl-sep{display:none}.pl-pin{font-size:11px;max-width:140px}.pl-empty{min-height:240px}}
.btnlike{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--btn);color:var(--fg);cursor:pointer;white-space:nowrap}
.btnlike:hover{filter:brightness(1.08)}
a.btnlike{text-decoration:none;gap:6px}
.btnlike.disabled{opacity:.45;pointer-events:none}
.logerr td{background:rgba(220,38,38,.08)}
.lrows{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--bd2)}
.lrow.room{grid-template-columns:120px minmax(0,1fr) 64px 92px}
/* Column headers look the same in every table: plain bold text on the header shade. Capitals are for title bars. */
.lrow.head{padding-top:6px;padding-bottom:6px;font-size:13px;font-weight:600;color:var(--fg);background:var(--gridh);border-bottom:2px solid var(--bd)}
.lrow.vl{grid-template-columns:64px minmax(0,1fr) minmax(0,1.6fr) 64px 92px}
.lrow.dm{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 64px 92px}
.lrow.tmap{grid-template-columns:minmax(0,1fr) 220px 92px}
.lpanel-add #vlId{flex:none;width:130px}
.lrow.mdl{grid-template-columns:minmax(0,1fr) 100px 80px}
.lrow input{width:100%;min-width:0;height:28px;box-sizing:border-box}
.lrow .n{text-align:right;font-variant-numeric:tabular-nums}
.lrow .site{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow button{width:100%;white-space:nowrap}
.lrow.head .n{text-align:right}
.lempty{padding:14px 12px;margin:0;color:var(--muted)}
.lpanel-add{display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid var(--bd2)}
.lpanel-add input{flex:1;min-width:0;height:28px;box-sizing:border-box}
.lpanel-add select{flex:0 0 160px;height:28px;min-width:0}
.lnote{margin:0;padding:0 12px 12px}
.ctlrow .pchk{width:112px;flex:none;white-space:nowrap}
.pchk-slot{display:inline-block;width:24px;flex:none}
.ctlrow .pchk.pchk-only{width:24px;justify-content:center}
.ctlrow .pchk-only input{margin:0}
table.types{table-layout:fixed;width:100%}
table.types th,table.types td{overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
table.types td input{width:100%;min-width:0;box-sizing:border-box}
table.types .icondd{display:flex;min-width:0;width:100%}
table.types td.n,table.types th.n{text-align:right}
.tabmenu{position:fixed;z-index:60;display:flex;flex-direction:column;min-width:180px;padding:4px;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-m);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tabmenu button{justify-content:flex-start;border:0;background:transparent;box-shadow:none;height:30px}
.tabmenu button:hover:not(:disabled){background:var(--hover)}
.icondd{position:relative;display:inline-block;min-width:200px;max-width:100%}
.icondd-btn,.icondd-item{display:flex;align-items:center;gap:8px;height:28px;padding:0 9px;justify-content:flex-start;font-weight:400}
.icondd-btn{width:100%}
.icondd-btn svg,.icondd-item svg{width:18px;height:18px;flex:none}
.icondd-btn span:nth-of-type(1){flex:1;text-align:left}
.icondd-caret{color:var(--muted);font-size:11px}
.icondd-list{position:fixed;z-index:30;max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-m);box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px}
.icondd-list[hidden]{display:none}
.icondd-item{width:100%;border:0;background:transparent;box-shadow:none}
.icondd-item:hover{background:var(--hover)}
.icondd-item[aria-selected="true"]{background:var(--panel2);font-weight:600}
.icondd-up{display:flex;align-items:center;height:30px;padding:0 9px;margin-top:4px;border-top:1px solid var(--bd2);cursor:pointer;font-size:12px;color:var(--accent);border-radius:var(--r-s)}
.icondd-up:hover{background:var(--hover)}
button.danger-text{background:var(--danger-bg);color:#fff;border-color:var(--danger-bg);font-weight:600}
button.primary{background:var(--accentbtn);color:var(--accentfg);border-color:var(--accentbtn);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
button.ghost{background:transparent;border-color:transparent}
button.icon{width:28px;padding:0}
svg.i{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.code{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.3px}

/* top bar */
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px));background:var(--panel);border-bottom:1px solid var(--bd)}
#brand{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.3px;margin-right:6px}
#toolbar:empty{display:none}   /* a view with its own bar leaves no empty band above it */
#brand .logo{width:24px;height:24px;flex:none;display:block}
#brand b{font-weight:800;letter-spacing:.2px}
#brand .word{font-weight:400;color:var(--muted)}
/* The sign-in screen and About show the logo larger. */
.brandmark{display:flex;align-items:center;gap:10px;font-size:18px}
.brandmark img{width:36px;height:36px;flex:none}
.brandmark b{font-weight:800}
.brandmark span{color:var(--muted)}
#brand small{font-weight:500;color:var(--muted)}
#search{width:300px;max-width:100%}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 6px;border-radius:var(--r-s);font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap;border:1px solid var(--bd);background:var(--panel2);color:var(--fg)}
/* The source of a user (LDAP, Lansweeper, Manual): one width, so the column lines up. */
.chip.usrc{width:84px;justify-content:center;box-sizing:border-box}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.warn{background:var(--warnbtn);border-color:var(--warnbtn);color:#fff}
.chip.bad{background:var(--danger-bg);border-color:var(--danger-bg);color:#fff}
.chip.info{background:var(--accentbtn);border-color:var(--accentbtn);color:var(--accentfg)}
.chip.kept{background:transparent;color:var(--muted);border-color:var(--bd)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--okdot);flex:none}
.dot.off{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--danger)}

/* main frame */
#main{flex:1;display:flex;min-height:0;position:relative}
#side{width:250px;flex:0 0 auto;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--bd);overflow:auto}
.hdr{background:var(--panel2);padding:4px 12px;font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;height:38px;flex:none}
.hdr button{height:22px;font-size:11px;padding:0 6px;text-transform:none;letter-spacing:0}
#side>.hdr:first-child{height:38px}
.item{display:flex;align-items:center;gap:8px;min-height:28px;padding:4px 10px 4px 12px;cursor:pointer;white-space:nowrap;border:none;background:none;width:100%;height:auto;justify-content:flex-start;border-radius:0;color:var(--fg);text-align:left}
.item:hover{background:var(--hover);filter:none}
.item.sel{background:var(--accentbtn);color:var(--accentfg)}
.item.sel .cnt{color:inherit;opacity:.85}
.item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .cnt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.item .sw{width:10px;height:10px;border-radius:2px;flex:none}
.item.sub{padding-left:28px}
.sidegroup{padding:4px 0 8px;border-bottom:1px solid var(--bd2)}

#content{flex:1;display:flex;flex-direction:column;min-width:0}
#tabsbar>*{flex:none}
#tabsbar{display:flex;gap:4px;background:var(--panel2);padding:0 6px;overflow-x:auto;overflow-y:hidden;height:38px;align-items:center;border-bottom:1px solid var(--bd);flex:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;background:var(--btn);border:1px solid var(--bd);border-radius:var(--r-s);cursor:pointer;white-space:nowrap;color:var(--fg)}
/* The active tab: its own background and a short, soft line under the text, not a full-width blue bar. */
.tab.active{background:var(--bg)}
.tab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:1px;background:var(--accent);opacity:.5;pointer-events:none}
.tab .x{color:var(--muted);font-size:14px;line-height:1;padding:0 2px;border-radius:2px}
.tab .x:hover{color:var(--fg);background:var(--hover)}
#objbar{display:flex;gap:4px;background:var(--panel);padding:0 6px;overflow-x:auto;overflow-y:hidden;height:34px;align-items:center;border-bottom:1px solid var(--bd);flex:none}
#objbar[hidden]{display:none}
#objbar>*{flex:none}
#objbar .tab.objtab{height:24px}
#objbar .tab.objtab .mono{max-width:220px;overflow:hidden;text-overflow:ellipsis}
#objbar .grow{flex:1 1 auto}
.objbar-close{height:24px;padding:0 10px;font-size:12px}
.tabs-cap{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;align-self:center;padding:0 4px;flex:none}
.tab.objtab{background:var(--panel);border-color:var(--bd);padding-left:8px;border-radius:4px}
.tab.objtab .tsw{width:8px;height:8px;border-radius:50%;flex:none}
.tab.objtab.active{background:var(--bg)}
.port.single{opacity:.5;cursor:not-allowed}
.tab.dragging{opacity:.4}
.tab.dragover{box-shadow:inset 2px 0 0 var(--accent)}
.tsw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.toolbar{padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--bd2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;min-height:38px}
.tbsep{width:1px;align-self:stretch;background:var(--bd);margin:2px 2px}
.view{flex:1;overflow:auto;min-height:0;position:relative}
.statusbar{display:flex;gap:14px;padding:3px max(8px, env(safe-area-inset-right, 0px)) 3px max(8px, env(safe-area-inset-left, 0px));font-size:12px;border-top:1px solid var(--bd2);background:var(--panel);flex:none;white-space:nowrap;overflow:hidden}
.statusbar span{display:inline-flex;align-items:center;gap:5px}

/* cards */
/* With thousands of cards or rows, the browser lays out only those near the screen; the rest keep an estimated size. */
.card{content-visibility:auto;contain-intrinsic-size:auto 150px}
table.grid tbody tr{content-visibility:auto;contain-intrinsic-size:auto 27px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;padding:12px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-m);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;height:auto;min-height:0;cursor:pointer;min-width:0;text-align:left;color:var(--fg);font:inherit;padding:0;gap:0;white-space:normal}
/* Cards in a row are as tall as the tallest, with the footer at the bottom of each. */
.card{align-self:stretch}
.card .kv{flex:1;align-content:start}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card .ch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd2)}
.tico{width:26px;height:26px;border-radius:var(--r-s);display:grid;place-items:center;flex:none;color:#fff}
.tico{color:#fff}
.tico svg{width:16px;height:16px;stroke:#fff}
.tico svg.cu{fill:currentColor;stroke:none}
svg.cu{fill:currentColor;stroke:none}
.tico.sm{width:20px;height:20px}.tico.sm svg{width:12px;height:12px}
.card .nm{font-family:var(--mono);font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .model{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .hd{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;padding:8px 10px;font-size:12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv dd.none{color:var(--muted);opacity:.6}
.cardlines{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px 12px;align-items:end;padding:10px 12px 12px}
.cardlines label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
@media (max-width:760px){.cardlines{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rels{border-top:1px solid var(--bd2);padding:6px 10px;display:flex;flex-direction:column;gap:3px;font-size:12px;flex:1}
.rels .r{display:flex;gap:6px;align-items:baseline;min-width:0}
.rels .r .k{color:var(--muted);flex:none}
.rels .r .t{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rels .r .p{color:var(--muted);font-family:var(--mono);flex:none}
.rels .none{color:var(--muted);font-style:italic}
.card .cf{display:flex;align-items:center;gap:6px;padding:5px 10px;border-top:1px solid var(--bd2);background:var(--panel);border-radius:0 0 var(--r-m) var(--r-m);font-size:11px;color:var(--muted)}
.card .cf .grow{flex:1}
.card .cf{white-space:nowrap}
.card .cf .code{font-family:var(--mono);flex:none}
.card .cf .chip{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* table */
.gridwrap{overflow:auto;height:100%}
table.grid{border-collapse:collapse;width:100%;font-size:13px;min-width:1000px}
table.grid th{position:sticky;top:0;background:var(--gridh);border-right:1px solid var(--bd);box-shadow:inset 0 -2px 0 var(--bd);padding:4px 8px;text-align:left;white-space:nowrap;font-weight:600;z-index:1}
table.grid td{border-right:1px solid var(--bd2);border-bottom:1px solid var(--bd2);padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#setUsers td>button{width:100%;padding:3px 6px}
/* Microsoft Graph setup steps */
.graph-steps{margin:0;padding:4px 12px 10px 34px;display:flex;flex-direction:column;gap:12px}
.graph-steps>li{padding-top:8px}
.graph-steps>li+li{border-top:1px solid var(--bd2)}
.graph-steps .form{grid-template-columns:170px minmax(0,1fr)}
.gs-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gs-head .chip{min-width:22px;justify-content:center}
/* overview */
.ov{display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1400px}
.ov-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ov-tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--bd);border-radius:var(--r-l);background:var(--panel);color:var(--fg);height:auto;font:inherit}
.ct-sum{display:flex;flex-wrap:wrap;gap:10px;padding:12px 12px 0}
.ct-sum .ov-tile{min-width:150px}.ct-sum .ov-tile b{font-size:18px}
.ct-kinds{display:flex;flex-direction:column;gap:2px;padding:10px 14px;font-size:13px}
.ct-sum-note{margin:0;padding:6px 12px 10px}
table.contracts td:last-child,table.contracts th:last-child{width:1%;white-space:nowrap}
button.ov-tile{cursor:pointer}button.ov-tile:hover{border-color:var(--accent)}
.ov-tl{font-size:12px;color:var(--muted)}
.ov-tv{font-size:28px;font-weight:600;line-height:1.2}
.ov-ts{font-size:12px;color:var(--muted)}
/* Panels in a row are as tall as the tallest, so a fresh inventory shows an even row of empty panels. */
.ov-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:stretch}
.ov-cols>.panelbox{display:flex;flex-direction:column}
.ov-att{display:flex;flex-direction:column}
.ov-row{display:flex;gap:10px;align-items:center;justify-content:flex-start;width:100%;text-align:left;padding:8px 12px;border:0;border-bottom:1px solid var(--bd2);background:none;color:var(--fg);height:auto;font:inherit;cursor:pointer;border-radius:0}
.ov-row:hover,.ov-bar:hover{background:var(--hover)}
.ov-row .chip{min-width:34px;justify-content:center}
.ov-row small{display:block;color:var(--muted);font-size:12px}
.ov-bars{display:flex;flex-direction:column;padding:6px 0}
.ov-bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 48px;gap:10px;align-items:center;padding:5px 12px;border:0;background:none;color:var(--fg);height:auto;font:inherit;font-size:13px;cursor:pointer;text-align:left;border-radius:0}
.ov-lbl{display:flex;gap:6px;align-items:center;min-width:0}.ov-lbl>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-track{height:10px;border-radius:0 4px 4px 0;background:transparent}
.ov-track>span{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.ov-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
@media (max-width:640px){.ov{padding:8px}.ov-cols{grid-template-columns:1fr}.ov-bar{grid-template-columns:minmax(90px,40%) 1fr 40px}}
/* costs: contracts, licences */
.sw-page{display:flex;flex-direction:column;gap:12px}
.sw-page>.panelbox.lic{margin:12px 12px 0}
.sw-page>.panelbox.lic>.hdr+.note{margin:0;padding:9px 12px;background:var(--sub);border-bottom:1px solid var(--bd2);color:var(--muted)}
.lic-bar{display:inline-block;width:90px;height:8px;border-radius:4px;background:var(--bd2);vertical-align:middle;margin-right:8px;overflow:hidden}
.lic-bar>span{display:block;height:100%;background:var(--accent)}
.lic-bar.over>span{background:var(--danger)}
.ct-devs{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;margin-top:6px}
.ct-devs .pchk{font-size:13px}
/* Counts and amounts: right-aligned in the text font, digits of equal width so a column lines up. */
.grid td.num,.grid th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* A unit after a field (CHF, months): as wide as its text, so the field keeps the width of the others. */
.ctlrow>.unit:not(.pchk){flex:none;color:var(--muted)}
table.contracts tfoot td{font-weight:600;border-top:2px solid var(--bd)}
button.link{background:none;border:0;padding:0;height:auto;color:var(--linktext);cursor:pointer;font:inherit;text-align:left}
button.link:hover{text-decoration:underline}
.btnlink{display:inline-flex;align-items:center;height:28px;padding:0 9px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--btn);color:var(--fg);text-decoration:none;white-space:nowrap;vertical-align:middle}
.btnlink:hover{filter:brightness(1.08)}
.sheet-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* The new password: in a box of its own with room around it, the Copy button apart from it. */
.sheet-pw{display:flex;align-items:center;gap:16px;padding:10px 14px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--bg)}
.sheet-pw code{font-size:20px;letter-spacing:.08em;flex:1;min-width:0;overflow-wrap:anywhere}
.form.sheet-form{grid-template-columns:170px minmax(0,1fr)}
td.act:has(.sheet-acts){white-space:normal;overflow:visible;text-overflow:clip}
.company-logo{display:flex;align-items:center;justify-content:center;width:180px;height:60px;border:1px dashed var(--bd);border-radius:var(--r-m);background:#fff}
.company-logo img{max-width:170px;max-height:52px;object-fit:contain}
/* The logo box is white in both themes (a logo is made for paper), so its placeholder text is a fixed grey. */
.company-logo>.muted{color:#5b6470}
.sheet-devs{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.sheet-devs .pchk{font-size:13px}
.sheet-devs .note{margin-left:4px}
table.grid tr:nth-child(even) td{background:var(--even)}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--hover)}
table.grid td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
table.grid.mini{min-width:640px}
table.grid.mini tbody tr{cursor:default}
.tdot{display:inline-flex;align-items:center;gap:6px}
/* Columns: drag the edge of a header to resize it, drag a header onto another to move it (as in NOBS SQL). */
table.grid th{overflow:hidden;text-overflow:ellipsis;position:sticky}
table.grid th[draggable="true"]{cursor:grab}
table.grid th.over{box-shadow:inset 3px 0 0 var(--accent),inset 0 -2px 0 var(--bd)}
table.grid th .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
table.grid th .rz:hover{background:var(--accent);opacity:.45}
/* Sorting: click a header. Filtering: a box under each header (the big tables only). */
table.grid th[data-sort="asc"]::after{content:' \25B2';font-size:9px;color:var(--muted)}
/* Software: a package opens in place to list its devices. */
table.grid.sw{width:100%;min-width:0;table-layout:fixed}
table.grid.sw tr:nth-child(even) td{background:none}
table.grid.sw .sw-row{cursor:pointer}
table.grid.sw .sw-row:hover td{background:var(--hover)}
table.grid.sw .sw-row.open td{background:var(--panel);border-bottom-color:transparent}
table.grid.sw td{padding:5px 8px;max-width:none}
table.grid.sw th[data-swsort]{cursor:pointer}
table.grid.sw th[data-sort="desc"]::after{content:' \25BC';font-size:9px;color:var(--muted)}
.sw-tgcol{width:34px;padding:0 0 0 6px!important}
table.grid.sw th.sw-name{width:34%}
table.grid.sw th.sw-cnt{width:170px}
@media (max-width:760px){
  table.grid.sw .sw-ver,table.sw-sub .sw-opt{display:none}
  table.grid.sw th.sw-name{width:auto}
  table.grid.sw th.sw-cnt{width:110px}
  .sw-bar{width:36px}
  .sw-devs{margin-left:12px}
  .sw-dev a{display:inline-flex;align-items:center;min-height:36px}   /* big enough to tap */
  #setPane .form{grid-template-columns:minmax(0,1fr)!important;gap:4px 0}   /* on a phone a settings label sits above its field */
  #setPane .form>label{margin-top:6px}
}
.sw-tg{width:24px;height:24px;padding:0;color:var(--muted)}
.sw-tg svg{transition:transform .15s ease}
.sw-row.open .sw-tg svg{transform:rotate(90deg)}
.sw-row.open .sw-tg{color:var(--accent)}
.vchips{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.vchip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border:1px solid var(--bd);border-radius:999px;font-family:var(--mono);font-size:11px;line-height:16px;background:var(--bg)}
.vchip i{font-style:normal;color:var(--muted);font-family:inherit}
.vchip.odd{border-color:var(--warn);color:var(--warntext)}
.sw-bar{display:inline-block;width:60px;height:4px;border-radius:2px;background:var(--bd2);margin-right:8px;vertical-align:middle;overflow:hidden}
.sw-bar>span{display:block;height:100%;background:var(--accent)}
table.grid.sw .sw-detail>td{padding:0 0 10px 0;background:var(--panel);white-space:normal}
.sw-devs{margin:0 12px 0 36px;border:1px solid var(--bd2);border-left:3px solid var(--accent);border-radius:var(--r-s);background:var(--bg);overflow:auto}
table.sw-sub{width:100%;border-collapse:collapse;font-size:12px}
table.sw-sub th{position:static;text-align:left;font-weight:600;font-size:13px;color:var(--fg);background:var(--gridh)!important;padding:5px 10px;border-bottom:1px solid var(--bd2);background:none;box-shadow:none;white-space:nowrap}
table.sw-sub td{padding:4px 10px;border-bottom:1px solid var(--bd2);border-right:0;white-space:nowrap;max-width:none}
table.sw-sub tr:last-child td{border-bottom:0}
/* The list of devices sits inside the software table: one colour, no stripes and no hover from the outer table. */
table.grid.sw .sw-detail:hover>td{background:var(--panel)}
table.grid.sw table.sw-sub td,table.grid.sw table.sw-sub tr:hover td{background:var(--bg)}
.sw-dev{display:inline-flex;align-items:center;gap:8px}
table.grid th[data-sort="desc"]::after{content:' \25BC';font-size:9px;color:var(--muted)}
table.grid tr.fr th{top:27px;padding:2px 3px;background:var(--gridh)}
table.grid tr.fr input{width:100%;height:22px;font-weight:400;font-size:11px;padding:1px 4px}

/* switch ports */
#net{padding:12px;display:flex;flex-direction:column;gap:12px}
.panelbox{border:1px solid var(--bd);border-radius:var(--r-m);background:var(--bg);min-width:0}
.panelbox>.hdr{border-radius:var(--r-m) var(--r-m) 0 0}
.panelbox .panelbox>.hdr{background:var(--panel)}
/* Settings: every section is a box of its own, with space between. The title bar is the darkest band, the line that says
   what the section is for sits on a lighter one, and the content on the page colour. */
#setPane{display:flex;flex-direction:column;gap:16px}
#setPane>div:not(.panelbox),#setPane>div:not(.panelbox)>div:not(.panelbox){display:flex;flex-direction:column;gap:16px}
#setPane div:empty:not(.panelbox *){display:none}
#setPane .panelbox{overflow:hidden;flex:none}
.ldap-adv{border-top:1px solid var(--bd2)}
.ldap-adv>summary{padding:9px 12px;cursor:pointer;color:var(--muted);font-size:12px}
.ldap-adv[open]>summary{border-bottom:1px solid var(--bd2)}
#setPane>*,#setPane>*>*{flex-shrink:0}
#setPane>#setLocs>.locgrid{display:grid}
#setPane .panelbox>.hdr{font-size:12px;height:40px;padding:4px 12px}
/* Settings sections open and close by their title: the arrow and title on the left, the count or state on the right. */
#setPane .panelbox>.hdr.sechdr{justify-content:flex-start;gap:8px}
#setPane .panelbox>.hdr.sechdr>:last-child:not(select){margin-left:auto}
#setPane .panelbox>.hdr.sechdr::before{margin-right:0}
#setPane .collapsed>.hdr{border-bottom:0;border-radius:var(--r-m)}
/* Per type: the type picked in the title, and three parts for it underneath. */
.tf-pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd2);font-weight:600}
.tf-pick select{min-width:220px;font-weight:400}
.tf-pick .muted{font-weight:400;font-size:12px}
.tf-sub{border-top:1px solid var(--bd2)}
.tf-sh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 2px;font-weight:600;font-size:13px}
.tf-sh .muted{font-weight:400;font-size:12px;padding-right:186px}
.tf-note{padding:2px 12px 8px;margin:0}
.fl-use{font-size:12px;text-align:right;white-space:nowrap}
#setPane .panelbox>.hdr+.note,#setPane .panelbox>.hdr+div>p.note:first-child,.modal .panelbox>.hdr+.note{margin:0;padding:9px 12px!important;background:var(--sub);border-bottom:1px solid var(--bd2);color:var(--muted)}
.face{padding:14px;overflow-x:auto}
.chassis{display:inline-flex;flex-direction:column;gap:8px;align-items:stretch;padding:10px 14px;border-radius:var(--r-m);background:var(--panel);border:1px solid var(--bd)}
.chassis .model{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;text-align:left}
.pgroups{display:flex;gap:10px}
.pgroup{display:grid;grid-template-rows:repeat(2,26px);grid-auto-flow:column;grid-auto-columns:28px;gap:4px}
.port{width:28px;height:26px;border-radius:2px;border:1px solid var(--portbd);background:var(--port);font-family:var(--mono);font-size:10px;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.port.used{background:var(--used);border-color:var(--used);color:#fff}
.port.upl{background:var(--upl);border-color:var(--upl);color:#fff}
.port.poe::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--poe);box-shadow:0 0 0 1px var(--bg)}
.port.sel{outline:2px solid var(--fg);outline-offset:1px}
.subnets{display:flex;flex-direction:column}
/* A subnet in the list, and the editor that opens in its place. */
.sn-item{padding:9px 12px;border-top:1px solid var(--bd2);display:flex;flex-direction:column;gap:3px}
.sn-head{display:flex;align-items:center;gap:10px;min-width:0}
.sn-head .mono{font-family:var(--mono)}
.sn-meta{font-size:12px;color:var(--muted);line-height:1.5}
.sn-meta .mono{font-family:var(--mono);color:var(--fg)}
.sn-addbar{padding:8px 12px;border-top:1px solid var(--bd2)}
.sn-edit{display:flex;flex-direction:column;gap:12px;padding:12px;border-top:1px solid var(--bd2);background:var(--panel)}
.sn-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.sn-grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.sn-grid label.span2{grid-column:span 2}
.sn-sect{display:flex;flex-direction:column;gap:6px}
.sn-sh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.sn-sh button{height:24px;padding:0 10px;font-size:12px}
.sn-tq{display:flex;gap:12px}
.sn-ranges{display:flex;flex-direction:column;gap:6px}
.sn-ranges:empty::before{content:'No ranges yet.';font-size:12px;color:var(--muted)}
.sn-range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 150px 28px;gap:8px;align-items:center}
.sn-rx{width:28px;padding:0}
.sn-typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 10px;padding:8px 10px;border:1px solid var(--bd2);border-radius:var(--r-m);background:var(--bg)}
.sn-type{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 4px;border-radius:var(--r-s);cursor:pointer;min-width:0}
.sn-type span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn-type:hover{background:var(--hover)}
.sn-type input{margin:0}
.sn-hint{margin:0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg)}
.sn-edit .subnet-foot{display:flex;align-items:center;gap:8px}
@media (max-width:760px){.sn-grid{grid-template-columns:1fr}.sn-grid label.span2{grid-column:auto}.sn-range{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px}.sn-range>.muted{display:none}.sn-range select{grid-column:1 / 3}}
.subnet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;padding:10px 12px;border-top:1px solid var(--bd2)}
.subnet label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.subnet label.span3{grid-column:span 3}
/* Device types: every type as a checkbox, wrapping across the full width. */
.sn-types{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:8px 10px;border:1px solid var(--bd2);border-radius:var(--r-m)}
.sn-types legend{padding:0 4px;font-size:12px;color:var(--muted)}
.subnet .sn-types label.pchk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--fg);cursor:pointer}
.sn-types .pchk input{margin:0}
@media (max-width:760px){
  .subnet{grid-template-columns:repeat(2,minmax(0,1fr))}
  .subnet label.span3{grid-column:1 / -1}
}
.subnet-foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px}
/* The add form is one subnet row with a title above and the Add button below, across the full width. */
.subnet-new{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--bd2)}
.subnet-new>.subnet{padding:0;border-top:0}
.subnet-new>#snAdd{align-self:flex-end}
.snmsg{font-size:12px}
.relgroup{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.mk{display:inline-block;margin-left:6px;padding:0 6px;border-radius:3px;font-size:10px;font-weight:600;line-height:16px;vertical-align:middle;white-space:nowrap}
.mk-new{background:var(--accent);color:#fff}
/* Edited by hand: a small pencil in the muted text colour, on the name's line; its title says what it means. */
.mk-hand{display:inline-flex;align-items:center;margin-left:6px;color:var(--muted);vertical-align:middle;flex:none}
.card .nmrow{display:flex;align-items:center;min-width:0}
/* On a card the pencil sits in the top right corner, a little larger; the header keeps room for it. */
.card{position:relative}
.card .mk-hand{position:absolute;top:9px;right:10px;margin:0}
.card .mk-hand svg{width:15px;height:15px}
.card:has(.mk-hand) .ch{padding-right:22px}
.card .nmrow .mk{flex:none}
.port.grp{box-shadow:inset 0 -4px 0 var(--g)}
.port.grp.lag{border-style:dashed}
.pgrouplegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px 10px;font-size:12px}
.pgl{display:inline-flex;align-items:center;gap:6px}
.pgl>i{width:12px;height:12px;border-radius:2px;background:var(--g);flex:none}
.pgl b{font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid var(--g);color:var(--g)}
.sfp .port{width:34px;border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 14px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;border:1px solid var(--portbd);background:var(--port)}

/* racks */
.rackbox{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:14px}
.rack{display:grid;grid-template-columns:44px minmax(0,1fr);border:1px solid var(--bd);border-radius:var(--r-s);background:var(--panel2);width:min(520px,100%);position:relative}
.rack .uno{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;height:24px;border-bottom:1px solid var(--bd2);box-sizing:border-box}
.rack .slot{height:24px;border-bottom:1px solid var(--bd2);background:repeating-linear-gradient(90deg,transparent 0 22px,var(--bd2) 22px 23px);opacity:.6;box-sizing:border-box}
.rack .unit{margin:1px 4px;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--bd);border-left:5px solid var(--c,#888);padding:2px 8px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;min-width:0;overflow:hidden;z-index:1}
.rack .unit:hover{border-color:var(--accent)}
.rack .unit.one{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;padding:0 8px}
.rack .unit.one .sub{font-size:11px;flex:none}
.rack .unit .nm{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rack .unit .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rackside{display:flex;flex-direction:column;gap:10px;min-width:240px;flex:1;max-width:420px}
.pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;padding:10px 12px}
.pp div{border:1px solid var(--portbd);border-radius:2px;padding:3px 5px;font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--port);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.pp div b{display:block;color:var(--fg);font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pp div.used{background:var(--used);border-color:var(--used);color:#fff}
.pp div.used b{color:#fff}

/* relationship map */
.mapwrap{position:absolute;inset:0;overflow:hidden;background:var(--bg);touch-action:none;user-select:none}
#mapSvg{width:100%;height:100%;display:block;cursor:grab}
.mnode{cursor:pointer}
.mnode.found>rect:first-child{stroke:var(--hi);stroke-width:2.5}
.mline{transition:opacity .12s}
.mline.hi path:not(.mhit),.mline:hover path:not(.mhit){stroke-width:2.6}
.mhit{cursor:pointer}
.mlab{opacity:0;transition:opacity .12s}
.mline:hover .mlab,.labels .mlab{opacity:1}
.focus .mline:not(.hi),.focus .mnode:not(.hi){opacity:.18}
.maphint{position:absolute;left:12px;bottom:10px;font-size:12px;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-m);padding:4px 8px;pointer-events:none}

/* object page */
.obj{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:12px;align-items:start}
.obj .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.form{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;padding:12px;align-items:center}
.form label{color:var(--muted);font-size:12px}
/* A remark under a field, in the field's column: a gateway other than the subnet's, a warranty that ends. */
.fieldnote{margin:-2px 0 2px;font-size:12px}
/* Warning text uses its own shade, which reads at 4.5:1 on the page in either theme. */
.fieldnote.warn{color:var(--warntext)} .fieldnote.bad{color:var(--danger)}
.wty.soon{color:var(--warntext);font-weight:600} .wty.ended{color:var(--danger);font-weight:600}
/* Subnets Lansweeper's adapters report that are not listed yet. */
.sn-suggest{padding:8px 12px 10px;border-top:1px solid var(--bd2)}
.sn-suggest .snrow{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12px}
.sn-suggest .snrow .mono{font-family:var(--mono)}
.sn-suggest .snrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.form input,.form select,.form textarea{width:100%}
.form input[type=checkbox],.form input[type=radio]{width:auto}
.form .ro{font-family:var(--mono);font-size:12px}
.rkrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rk-mount{display:contents}
.rk-mount[hidden]{display:none}
.hits{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
button.chip{cursor:pointer;height:24px;font-size:12px}
.relist{display:flex;flex-direction:column}
.relrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bd2);min-width:0}
.relrow:last-child{border-bottom:none}
.relrow .k{color:var(--muted);width:118px;flex:none;font-size:12px}
.relrow .t{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.relrow .t a{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relrow .p{font-family:var(--mono);font-size:12px;color:var(--muted)}
.relrow button{height:22px;width:22px}
/* Links have their own shade, readable on the page and on the tinted section bands in either theme. */
a,a.link{color:var(--linktext)}
a.link{cursor:pointer;text-decoration:none}
a.link:hover{text-decoration:underline}
.addrel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-top:1px solid var(--bd2);background:var(--panel);border-radius:0 0 var(--r-m) var(--r-m)}
.addrel select,.addrel input{min-width:0}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:12px}
.chain{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px}
.hop{display:flex;align-items:center;gap:6px;padding-left:12px;font-size:12px;color:var(--muted);line-height:1.4}
.hop b{color:var(--fg);font-weight:600}
.node{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:var(--r-s);padding:3px 8px 3px 4px;background:var(--panel);font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--fg);height:auto}
.node.me{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.edge{display:inline-flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);line-height:1.2;font-family:var(--mono)}
.edge::after{content:"";width:28px;height:1px;background:var(--muted);margin-top:2px}
.netpath{list-style:none;margin:0;padding:12px 14px}
.ps{position:relative;padding-left:22px}
.ps::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--bd)}
.ps:first-child::before{top:11px}
.ps:last-child::before{bottom:auto;height:11px}
.ps-hop{font-size:11px;color:var(--muted);font-family:var(--mono);padding:4px 0 2px}
.ps-hop b{color:var(--fg);font-weight:600}
.ps-row{display:flex;align-items:center;gap:8px;min-height:24px}
.ps-dot{position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);box-sizing:border-box}
.ps.me .ps-dot{background:var(--accent);border-color:var(--accent)}
.ps-name{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-family:var(--mono);font-size:12px;color:var(--fg);cursor:pointer}
.ps-name:hover span{text-decoration:underline}
.ps.me .ps-name{font-weight:600}
.ps-type{font-size:11px;color:var(--muted)}
.ps-me{font-size:11px;color:var(--accent)}
/* Notes and attachments use the same two columns as every field: the list, then the sync column kept free. */
.entries{align-items:flex-start}
.form label:has(+ .entries){align-self:start;padding-top:8px}
.entries-box{display:flex;flex-direction:column;gap:8px}
.entry{border:1px solid var(--bd2);border-radius:var(--r-s);padding:8px 10px;background:var(--panel)}
.entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entry-head b{flex:1;min-width:0}
.entry-text{margin-top:4px;font-size:12px;color:var(--muted);white-space:pre-wrap}
.entry-add>input:first-child{flex:1 1 100%}
.entry-add>input{flex:1 1 120px}
.entry-add button{flex:none}
#setFeed{display:flex;flex-direction:column;gap:12px}
.lrow.fl{grid-template-columns:minmax(0,1fr) 90px 90px 84px}
.fl-move{display:flex;gap:4px}
.sess-list{border:1px solid var(--bd2);border-radius:var(--r-s);overflow:hidden;background:var(--panel)}
.sess{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--bd2)}
.sess:last-child{border-bottom:0}
.sess-main{flex:1;min-width:0}
.sess-name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess-when{font-size:12px;color:var(--muted);margin-top:2px}
.sess-here{font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--accentbtn);color:#fff}
.sess-foot{display:flex;justify-content:flex-end;padding:10px 0 0}
.lsbox{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;padding:10px 12px;font-size:12px;margin:0}
.lsbox dt{color:var(--muted)} .lsbox dd{margin:0;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}
.lsbox dd.plain{font-family:inherit}
.lsbox .lsbox-check{width:auto;white-space:normal;gap:6px;margin:0}
.lsbox .lsbox-check input{margin:0}
.pchk{display:inline-flex;gap:6px;align-items:center;font-size:12px;white-space:normal;min-width:0}
.pchk input{height:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;padding:10px 12px}
.trules td input:not([type=checkbox]),.trules td select{width:100%}
.trules tr.off td{opacity:.55}
.trules td.act{white-space:nowrap}
.pgrid-extra{border-top:1px solid var(--bd2);grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.hist{list-style:none;margin:0;padding:6px 12px 10px;font-size:12px}
.hist li{display:flex;gap:10px;align-items:center;padding:4px 0;line-height:1.5;border-bottom:1px dashed var(--bd2)}
.hist li:last-child{border-bottom:none}
.hist time{font-family:inherit;font-size:inherit;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* modal */
/* Signed out: nothing of the app is drawn behind the sign-in dialog, and the dialog has a solid backdrop. */
body.signed-out>:not(#modalHost){visibility:hidden}
body.signed-out #modalHost .modal{background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-l);box-shadow:0 10px 40px rgba(0,0,0,.4);width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0}
.modal .box.sm{width:min(580px,100%)}
.modal .box.wide{width:min(1000px,100%)}
.modal .box.settings{width:min(1200px,100%);height:min(860px,calc(100vh - 40px))}
.modal .box.settings>.mb{flex:1}
.settabs{display:flex;gap:4px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--bd);overflow-x:auto;flex:none}
.modal .mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);font-weight:600;font-size:14px}
.modal .mb{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;background:var(--bg);min-height:0}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 14px;border-top:1px solid var(--bd)}
.src{border:1px solid var(--bd);border-radius:var(--r-m);padding:10px;display:flex;gap:10px;cursor:pointer;background:var(--bg);align-items:flex-start}
.src:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--hover)}
.src input{height:auto;margin-top:2px}
.src b{display:block;margin-bottom:2px}
.src small{color:var(--muted);line-height:1.4;display:block}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.diff{font-family:var(--mono);font-size:12px}
.diff del{color:var(--danger);text-decoration:line-through}
.diff ins{color:var(--used);text-decoration:none}

.maplegend{position:absolute;right:12px;bottom:10px;max-width:280px;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-m);font-size:11px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.maplegend>summary{list-style:none;cursor:pointer;padding:6px 10px;font-weight:600;color:var(--fg);user-select:none;white-space:nowrap}
.maplegend>summary::-webkit-details-marker{display:none}
.maplegend>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-m)}
.maplegend .lgbody{display:flex;flex-direction:column;gap:4px;padding:0 10px 8px;border-top:1px solid var(--bd2);margin-top:0;padding-top:8px}
.maplegend .lgtypes{display:flex;flex-wrap:wrap;gap:4px 10px}
.maplegend .lgtypes span{display:inline-flex;align-items:center;gap:4px}
.maplegend .lgtext{color:var(--muted);line-height:1.4}
/* Object page: each panel folds from its header. Save waits for a change. More holds the rare actions. */
.sechdr{cursor:pointer;user-select:none}
/* Object page panels: title left-aligned after the fold arrow, count on the right. */
.obj .panelbox>.hdr{justify-content:flex-start;position:relative;text-align:left}
.obj .panelbox>.hdr>span.muted,.obj .panelbox>.hdr>span.cnt{position:absolute;right:12px;top:50%;transform:translateY(-50%);margin:0}
.sechdr::before{content:'\25BE';margin-right:6px;display:inline-block;transition:transform .15s}
.collapsed>.sechdr::before{transform:rotate(-90deg)}
.collapsed>:not(.sechdr){display:none}
.grp.collapsed>#cards{display:none}
details.menu{position:relative}
details.menu>summary{list-style:none;display:inline-flex;align-items:center;height:28px;padding:0 9px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--btn);cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.menubox{position:absolute;right:0;top:32px;z-index:10;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-m);box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:4px;min-width:150px}
.menubox button{justify-content:flex-start}
.readonly .obj input:disabled,.readonly .obj select:disabled{opacity:.85}
#whoBtn{height:28px;font-size:13px;color:var(--muted)}
#toast{position:fixed;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(36px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:var(--r-m);box-shadow:var(--shadow);font-size:12px;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

#sideBtn{display:none}
@media (max-width:820px){
 #sideBtn{display:inline-flex}
 #side{position:absolute;inset:0 auto 0 0;z-index:20;box-shadow:var(--shadow);display:none}
 body.side-open #side{display:flex}
 #search{width:100%;order:10}
 #brand small,.hide-n{display:none}
 .obj{grid-template-columns:minmax(0,1fr)}
 .form{grid-template-columns:90px minmax(0,1fr)}
 #cards{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Touch screens: the controls are bigger, so a finger hits the one it means to. The desktop size is unchanged. */
@media (pointer:coarse){
  button,input:not([type=checkbox]):not([type=radio]),select,.tab,.item{min-height:40px}
  input:not([type=checkbox]):not([type=radio]),select{height:40px}
  input[type=checkbox],input[type=radio]{width:24px!important;height:24px!important}
  table.grid tr.fr input{height:36px!important;font-size:14px}
  button.icon{min-width:40px}
}
</style>
</head>
<body>

<div id="bar">
  <button id="sideBtn" class="icon" title="Filters" aria-label="Show filters"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div id="brand"><img class="logo" src="logo.svg" alt=""><span><b>NOBS</b> <span class="word">Inventory</span></span></div>
  <input id="search" type="search" placeholder="Search code, name, IP, MAC, serial, user…" aria-label="Search">
  <label class="pchk" title="Search every device, not only the filtered ones" style="white-space:nowrap"><input type="checkbox" id="searchAll"> All devices</label>
  <button id="newBtn" class="primary"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New object</button>
  <div class="grow"></div>
